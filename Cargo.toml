[workspace]
members = [
  "crates/quickql-core",
  "crates/ql-engine",
  "crates/ql-lsp"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
tower-lsp = "0.20"
url = "2.5"
