[workspace]
members = [
  "crates/quickql-core",
  "crates/quickql-macros",
  "crates/ql-engine",
  "crates/ql-lsp",
  "crates/ql-webservice"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
faer = "0.23.2"
linfa = "0.8.1"
linfa-clustering = "0.8.1"
linfa-nn = "0.8.1"
manifolds-rs = "0.3.3"
ndarray = "0.16"
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
syn = { version = "2.0", features = ["full"] }
tokio = { version = "1.40", features = ["full"] }
tower-lsp = "0.20"
url = "2.5"
